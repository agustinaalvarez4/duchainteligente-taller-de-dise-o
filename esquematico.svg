  <text x="54" y="190" font-family="Arial, sans-serif" font-size="13" fill="#111">GND</text>
  <text x="165" y="230" font-family="Arial, sans-serif" font-size="13" fill="#111">Pin 2 (FLOW)</text>
  <text x="165" y="280" font-family="Arial, sans-serif" font-size="13" fill="#111">Pin 7 (BUZZ)</text>
