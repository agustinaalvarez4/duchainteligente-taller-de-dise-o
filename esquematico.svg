  <text x="344" y="195" font-family="Arial, sans-serif" font-size="12" fill="#111">GND (Negro) -> GND</text>
  <text x="344" y="218" font-family="Arial, sans-serif" font-size="12" fill="#111">Signal (Amarillo) -> Pin 2</text>

