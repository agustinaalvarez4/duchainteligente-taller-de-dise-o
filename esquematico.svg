<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">Esquematico Ducha Inteligente (Sin Valvula)</text>

