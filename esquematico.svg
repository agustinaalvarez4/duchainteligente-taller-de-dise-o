  <text x="165" y="375" font-family="Arial, sans-serif" font-size="13" fill="#111">Pin 9 (YELL)</text>
  <text x="165" y="420" font-family="Arial, sans-serif" font-size="13" fill="#111">Pin 10 (RED)</text>

